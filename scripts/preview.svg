<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="1280" height="800">
  <!-- Settings -> Look poster for the EVA layout. Render: rsvg-convert -w 1280 -h 800 scripts/preview.svg -o layouts/eva.png -->
  <defs>
    <clipPath id="band"><polygon points="0,150 320,138 320,200 0,200"/></clipPath>
    <pattern id="hazard" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#0a0a0a"/>
      <rect width="6" height="12" fill="#3a2a55"/>
    </pattern>
  </defs>

  <rect width="320" height="200" fill="#07060b"/>

  <!-- warning-light strip: dark with a red rule -->
  <rect width="320" height="7" fill="#160e24"/>
  <rect y="7" width="320" height="1" fill="#e0002a"/>

  <!-- contour rings -->
  <g fill="none" stroke="#6b3fa0" stroke-width="0.8">
    <ellipse cx="250" cy="84" rx="30" ry="16" opacity="0.55"/>
    <ellipse cx="250" cy="84" rx="52" ry="28" opacity="0.45"/>
    <ellipse cx="250" cy="84" rx="74" ry="40" opacity="0.35"/>
    <ellipse cx="250" cy="84" rx="96" ry="54" opacity="0.25"/>
  </g>

  <!-- title -->
  <rect x="14" y="15" width="64" height="2" fill="#ff6a00"/>
  <text x="13" y="64" font-family="Hiragino Mincho ProN" font-weight="900" font-size="44" fill="#f2f2f2">中央管制</text>
  <rect x="14" y="72" width="22" height="3" fill="#8fd14f"/>
  <rect x="40" y="72" width="70" height="3" fill="#3a2a55"/>

  <!-- seven-segment 01 -->
  <rect x="236" y="20" width="70" height="52" fill="#0a0a0a" stroke="#8fd14f" stroke-width="1"/>
  <g fill="#8fd14f">
    <rect x="252" y="26" width="13" height="3"/>
    <rect x="248" y="29" width="3" height="16"/>
    <rect x="266" y="29" width="3" height="16"/>
    <rect x="248" y="47" width="3" height="16"/>
    <rect x="266" y="47" width="3" height="16"/>
    <rect x="252" y="63" width="13" height="3"/>
    <rect x="287" y="29" width="3" height="16"/>
    <rect x="287" y="47" width="3" height="16"/>
  </g>

  <!-- signal field -->
  <g fill="none" stroke-linecap="round">
    <path d="M0,104 C40,96 80,92 120,100 S200,118 240,106 S300,86 320,96" stroke="#6b3fa0" stroke-width="1.2" opacity="0.7"/>
    <path d="M0,112 C40,100 70,90 110,96 S180,122 230,118 S290,94 320,106" stroke="#ff6a00" stroke-width="1.2" opacity="0.35"/>
    <path d="M0,110 C30,100 60,96 90,102 S150,92 190,88 S270,118 320,124" stroke="#ff6a00" stroke-width="1.8"/>
    <path d="M0,122 C40,110 70,104 110,104 S170,118 220,128 S290,120 320,110" stroke="#9a6bd6" stroke-width="1.8"/>
  </g>

  <!-- hazard band -->
  <rect width="320" height="200" fill="url(#hazard)" clip-path="url(#band)"/>

  <!-- selected plate: purple with an orange edge -->
  <polygon points="16,160 196,160 210,172 210,190 16,190" fill="#6b3fa0"/>
  <rect x="16" y="160" width="5" height="30" fill="#ff6a00"/>
  <text x="30" y="182" font-family="Hiragino Mincho ProN" font-weight="900" font-size="15" fill="#f2f2f2">稼働</text>
  <g fill="#8fd14f">
    <rect x="76" y="171" width="9" height="9"/><rect x="88" y="171" width="9" height="9"/>
    <rect x="100" y="171" width="9" height="9"/><rect x="112" y="171" width="9" height="9"/>
    <rect x="124" y="171" width="9" height="9"/><rect x="136" y="171" width="9" height="9"/>
    <rect x="148" y="171" width="9" height="9"/>
  </g>
  <g fill="none" stroke="#b8aed0" stroke-width="0.8" opacity="0.7">
    <rect x="160.5" y="171.5" width="8" height="8"/><rect x="172.5" y="171.5" width="8" height="8"/>
    <rect x="184.5" y="171.5" width="8" height="8"/>
  </g>
</svg>
